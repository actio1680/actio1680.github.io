<div class="proyecto-dinamico" data-repo="BD-Normas-XIX">
  <h2>Base de datos de Normas del Poder Legislativo y Ejecutivo (1820–2025)</h2>
  
  <div id="normas-loader">
    <p>Cargando base de datos desde GitHub…</p>
  </div>

  <p class="small-note">
    ⚙️ Los datos se obtienen directamente desde 
    <a href="https://github.com/actio1680/Cuerpos-legales-Peru/tree/main/Normas-Legislativo-Ejecutivo/BD-Normas-XIX" target="_blank">
      Cuerpos-legales-Peru/BD-Normas-XIX
    </a>.
  </p>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const container = document.querySelector('.proyecto-dinamico[data-repo="BD-Normas-XIX"]');
    if (!container) return;

    const loader = document.getElementById('normas-loader');
    const url = 'https://raw.githubusercontent.com/actio1680/Cuerpos-legales-Peru/main/Normas-Legislativo-Ejecutivo/BD-Normas-XIX/README.md';

    // Esperar a que las librerías estén listas
    function waitForLibs() {
      if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
        fetchAndRender();
      } else {
        setTimeout(waitForLibs, 50);
      }
    }

    function fetchAndRender() {
      fetch(url)
        .then(res => res.ok ? res.text() : Promise.reject('No se pudo cargar el README.md'))
        .then(md => {
          const html = DOMPurify.sanitize(
            marked.parse(md),
            {
              ALLOWED_TAGS: ['h1','h2','h3','p','ul','ol','li','table','thead','tbody','tr','th','td','a','br','strong','em','code','pre','img'],
              ALLOWED_ATTR: ['href','target','src','alt','width','height']
            }
          );
          loader.innerHTML = html;
        })
        .catch(err => {
          loader.innerHTML = `<p style="color:#c0392b;">⚠️ Error: ${err.message}. 
            <a href="${url}" target="_blank">Ver raw</a></p>`;
        });
    }

    waitForLibs();
  });
</script>
